name: "Setup Anchor CLI"
description: >
  Install the Anchor CLI pinned by ANCHOR_VERSION via avm (which downloads the
  prebuilt release binary) and cache it. avm itself is built with `+stable`.
runs:
  using: "composite"
  steps:
    - name: Cache Anchor CLI (avm)
      id: cache-anchor
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.avm
        key: ${{ runner.os }}-anchor-${{ env.ANCHOR_VERSION }}

    - name: Install Anchor CLI
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal --no-self-update
        if ! command -v avm >/dev/null 2>&1; then
          sudo apt-get update -y
          sudo apt-get install -y libudev-dev pkg-config build-essential
          # `+stable` overrides the repo's rust-toolchain.toml for this build.
          cargo +stable install --git https://github.com/coral-xyz/anchor avm --locked --force
        fi
        avm install "${ANCHOR_VERSION}"
        avm use "${ANCHOR_VERSION}"
        anchor --version
