name: "Build Program (solana-verify + IDL)"
description: >
  Builds `merkle_distributor.so` as SBPF v3 with `solana-verify build` — the SAME
  tool + image (solanafoundation/solana-verifiable-build:SOLANA_VERSION) that
  `solana-verify verify-from-repo` and explorers use.
  This is what makes the deployed program verifiable: its on-chain hash will match
  what verify-from-repo recomputes. (`anchor build --verifiable` uses a different
  image and would NOT verify.) Output .so lands in target/deploy/; the IDL comes
  from `anchor idl build` (solana-verify doesn't emit an Anchor IDL).
inputs:
  program:
    description: "Program crate / library name"
    required: false
    default: merkle_distributor
runs:
  using: "composite"
  steps:
    - name: Install stable Rust (for host tooling)
      shell: bash
      run: rustup toolchain install stable --profile minimal --no-self-update

    - uses: ./.github/actions/setup-solana/
    - uses: ./.github/actions/setup-anchor/

    - name: Cache solana-verify
      id: cache-solana-verify
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cargo/bin/solana-verify
        key: ${{ runner.os }}-solana-verify-v0.5.2

    - name: Install solana-verify
      if: steps.cache-solana-verify.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -y && sudo apt-get install -y libudev-dev
        cargo +stable install solana-verify --version 0.5.2 --locked

    - name: Verifiable build (.so) + IDL
      shell: bash
      env:
        PROGRAM: ${{ inputs.program }}
      run: |
        set -euo pipefail
        # Pinned image + --arch v3. Writes target/deploy/<program>.so.
        # NOTE: `solana-verify verify-from-repo` must use this SAME -b image and
        # --arch to match.
        solana-verify build \
          --base-image "solanafoundation/solana-verifiable-build:${SOLANA_VERSION}" \
          --library-name "$PROGRAM" \
          --arch v3
        # SIMD-0500 rejects upgrades older than SBPF v3; ELF e_flags holds the version.
        SBPF_VERSION="$(od -An -t u4 -j 48 -N 4 "target/deploy/${PROGRAM}.so" | tr -d ' ')"
        if [ "$SBPF_VERSION" != "3" ]; then
          echo "Expected SBPF v3, got e_flags=${SBPF_VERSION}" >&2
          exit 1
        fi
        # anchor idl build needs nightly; RUSTUP_TOOLCHAIN pins which one.
        rustup toolchain install "$IDL_NIGHTLY" --profile minimal --no-self-update
        mkdir -p target/idl
        RUSTUP_TOOLCHAIN="$IDL_NIGHTLY" anchor idl build -p "$PROGRAM" \
          -o "target/idl/${PROGRAM}.json"
        ls -l "target/deploy/${PROGRAM}.so" "target/idl/${PROGRAM}.json"

    - name: Upload .so artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.program }}-so
        path: target/deploy/${{ inputs.program }}.so

    - name: Upload IDL artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.program }}-idl
        path: target/idl/${{ inputs.program }}.json
