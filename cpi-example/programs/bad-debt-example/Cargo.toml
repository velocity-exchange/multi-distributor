[package]
name = "bad-debt-example"
version = "0.1.0"
description = "Example program that owns bad debt and claims its DFX allocation from the merkle distributor via CPI"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bad_debt_example"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "merkle-distributor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
no-log-ix-name = []

[dependencies]
anchor-lang = "0.31.2"
anchor-spl = "0.31.2"
# When adapting this example in your own repo, replace the path dependency with:
# merkle-distributor = { git = "https://github.com/drift-labs/multi-distributor", features = ["cpi"] }
merkle-distributor = { path = "../../../programs/merkle-distributor", features = ["cpi"] }
# Match the major version the distributor program is built against.
solana-program = "2.3"
